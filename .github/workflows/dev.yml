name: dev

on:
  push:
    branches: [master]
    paths-ignore:
      - 'LICENSE'
      - '**/LICENSE'
      - '*.md'
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        run: echo "" >> ./local.properties

      - name: Restore keystore
        run: |
          # AGP's debug signing config looks for debug.keystore under the Android user home.
          # On Linux that is $XDG_CONFIG_HOME/.android when the variable is set (GitHub
          # runners set it), otherwise $HOME/.android. Write both, or AGP finds nothing and
          # quietly generates a fresh key, which makes every build un-installable over the
          # last one.
          xdg_root="${XDG_CONFIG_HOME:-$HOME/.config}"
          mkdir -p "$HOME/.android" "$xdg_root/.android"
          echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$xdg_root/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore" "$xdg_root/.android/debug.keystore"
          od -An -tx1 -N4 "$HOME/.android/debug.keystore"

      - name: Compute the dev version
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 --match '[0-9]*')
          commits=$(git rev-list --count "$tag"..HEAD)
          total=$(git rev-list --count HEAD)
          echo "name=${tag}-dev.${commits}" >> "$GITHUB_OUTPUT"
          echo "code=${total}" >> "$GITHUB_OUTPUT"
          echo "stable=${tag}" >> "$GITHUB_OUTPUT"
          echo "cycle=dev-${tag}" >> "$GITHUB_OUTPUT"

      - name: Build the debug APK
        run: ./gradlew assembleDebug -PdevVersionName="${{ steps.version.outputs.name }}" -PdevVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify the debug APK signer
        run: python3 tools/verify_signer.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify the debug APK
        run: |
          # Several build-tools versions ship aapt; pick the newest one. Without this the
          # glob expands to several paths and aapt receives them as bad arguments.
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          badging=$("$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$badging"
          echo "$badging" | grep -q "package: name='com.aatorque.stats.debug'"
          echo "$badging" | grep -q "versionName='${{ steps.version.outputs.name }}.debug'"
          echo "$badging" | grep -q "versionCode='${{ steps.version.outputs.code }}'"

      - name: Rename the debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/aa-torque-dev-${{ steps.version.outputs.name }}.apk"

      - name: Compute release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_notes.py \
            --tag "${{ steps.version.outputs.stable }}" \
            --head HEAD \
            --version "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --repo-slug "${{ github.repository }}" \
            --dev \
            --out notes.md
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move the cycle tag to this commit
        run: |
          # One pre-release per stable cycle. The tag follows the newest build of the cycle,
          # so the release page names the commit it actually shows.
          tag="${{ steps.version.outputs.cycle }}"
          git tag -f "$tag" HEAD
          git push -f origin "refs/tags/$tag"

      - name: Publish the dev pre-release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: dev builds after ${{ steps.version.outputs.stable }}
          tag_name: ${{ steps.version.outputs.cycle }}
          prerelease: true
          draft: false
          body: ${{ steps.notes.outputs.body }}
          files: app/build/outputs/apk/debug/aa-torque-dev-${{ steps.version.outputs.name }}.apk
          # The file name carries the version, and every build of the cycle stays on its
          # release so an older one can be installed for testing. They share one key
          # (pinned above), so any build installs over any other.
          overwrite_files: true
