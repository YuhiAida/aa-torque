name: ci
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        run: echo "" >> ./local.properties

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck

      - name: Lint the release variant
        run: ./gradlew lintRelease

      - name: Generate source inventory
        run: python3 tools/gen_inventory.py

      - name: Commit the inventory when it changed
        run: |
          if git diff --quiet -- docs/generated/inventory.md; then
            echo "inventory is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/inventory.md
          git commit -m "chore: refresh source inventory [skip ci]"
          # A push made with GITHUB_TOKEN does not start another workflow run,
          # so this commit cannot loop. `git push origin HEAD` targets the branch
          # of the same name and needs no ref_name interpolation.
          git push origin HEAD

  build_deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The version bump reads commit messages back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Restore keystore
        run: echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > $HOME/debug.keystore

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Bump version
        id: bump_version
        if: github.repository == 'YuhiAida/aa-torque'
        uses: oflynned/android-version-bump@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: "latest"
          tag_exists_error: false
          force_push_tag: true
          message: "Latest release"

      - name: Build Release apk
        if: github.repository == 'agronick/aa-torque'
        run: >
          echo "" >> ./local.properties &&
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$HOME/debug.keystore 
          -Pandroid.injected.signing.key.alias=androiddebugkey 
          -Pandroid.injected.signing.store.password=android 
          -Pandroid.injected.signing.key.password=android

      - name: Build Release apk for forked repos
        if: github.repository != 'agronick/aa-torque'
        run: >
           echo "" >> ./local.properties && ./gradlew assembleRelease 

      - name: Rename release
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aa-torque.apk

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.bump_version.outputs.git_tag || 'latest' }}
          name: ${{ steps.bump_version.outputs.git_tag || 'latest' }}
          generate_release_notes: true
          draft: true
          files: |
            app/build/outputs/apk/release/aa-torque.apk
            app/build/outputs/mapping/release/mapping.txt
