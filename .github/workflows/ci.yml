name: ci
on: [push]

# One run per branch at a time. A burst of merges would otherwise start a
# build_deploy job per push, and every one of them bumps and pushes
# version.properties — on 2026-10-31 three of four failed that way with
# "non-fast-forward" and "tag already exists". The newest run wins; a run that
# was cancelled after it pushed its bump commit is caught by the bump guard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        run: echo "" >> ./local.properties

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck

      - name: Lint the release variant
        run: ./gradlew lintRelease

      - name: Generate source inventory
        run: python3 tools/gen_inventory.py

      - name: Commit the inventory when it changed
        run: |
          if git diff --quiet -- docs/generated/inventory.md; then
            echo "inventory is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/inventory.md
          git commit -m "chore: refresh source inventory [skip ci]"
          # A push made with GITHUB_TOKEN does not start another workflow run,
          # so this commit cannot loop. `git push origin HEAD` targets the branch
          # of the same name and needs no ref_name interpolation.
          git push origin HEAD

  build_deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The version bump reads commit messages back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Restore keystore
        run: echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > $HOME/debug.keystore

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Check whether this commit is already a version bump
        id: bump_guard
        run: |
          # A run cancelled after it pushed its bump commit leaves a
          # 'release: v...' commit on master. Do not bump a second time for it.
          if git log -1 --pretty=%s | grep -qE '^release: v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump_version
        if: github.repository == 'YuhiAida/aa-torque' && steps.bump_guard.outputs.skip == 'false'
        uses: oflynned/android-version-bump@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Build Release apk
        if: github.repository == 'agronick/aa-torque'
        run: >
          echo "" >> ./local.properties &&
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$HOME/debug.keystore 
          -Pandroid.injected.signing.key.alias=androiddebugkey 
          -Pandroid.injected.signing.store.password=android 
          -Pandroid.injected.signing.key.password=android

      - name: Build Release apk for forked repos
        if: github.repository != 'agronick/aa-torque'
        run: >
           echo "" >> ./local.properties && ./gradlew assembleRelease
           -Pandroid.injected.signing.store.file=$HOME/debug.keystore
           -Pandroid.injected.signing.key.alias=androiddebugkey
           -Pandroid.injected.signing.store.password=android
           -Pandroid.injected.signing.key.password=android

      - name: Rename release
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aa-torque.apk

      - name: Read the release version
        id: version
        run: |
          tag=$(grep -E '^(majorVersion|minorVersion|patchVersion)=' version.properties | cut -d= -f2 | paste -sd. -)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release version: $tag"

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: true
          files: |
            app/build/outputs/apk/release/aa-torque.apk
            app/build/outputs/mapping/release/mapping.txt
