name: ci

# Pushes run on master only. A same-repo pull request used to start a second, identical
# run through this trigger (issue #47); the pull_request trigger is now the only path for
# a branch. A branch push with no pull request gets no checks — open the PR first.
on:
  push:
    branches: [master]
  pull_request:

# One run per branch at a time. A burst of merges would otherwise start a
# build_deploy job per push, and every one of them bumps and pushes
# version.properties — on 2026-10-31 three of four failed that way with
# "non-fast-forward" and "tag already exists". The newest run wins; a run that
# was cancelled after it pushed its bump commit is caught by the bump guard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change once, so every gate reports on every pull request. A workflow
  # skipped by a path filter creates no check run, and a required check that never reports
  # blocks the merge forever (issue #48).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      themes: ${{ steps.diff.outputs.themes }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        name: Classify the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$changed" ]; then
            code=false
            themes=false
            docs=false
          else
            # Prose only (LICENSE, markdown, docs/) must not mint a version; the old
            # paths-ignore guaranteed that for the release job.
            if echo "$changed" | grep -qvE '(^|/)LICENSE$|\.md$|^docs/'; then
              code=true
            else
              code=false
            fi
            if echo "$changed" | grep -qE '^app/src/main/res/(values|drawable)|^tools/check_themes\.py|^\.github/workflows/ci\.yml'; then
              themes=true
            else
              themes=false
            fi
            if echo "$changed" | grep -qE '\.md$|^docs/|^tools/check_docs\.py|^\.github/workflows/ci\.yml'; then
              docs=true
            else
              docs=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "themes=$themes" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

      - name: Guard against stray version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qx 'version.properties'; then
            case "$BRANCH" in
              release/*) ;;
              *)
                echo "::error title=stray version bump::version.properties may only change on a release/* branch."
                exit 1
                ;;
            esac
          fi

  lint:
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        if: needs.changes.outputs.code == 'true'
        run: echo "" >> ./local.properties

      - name: Check Kotlin style
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew ktlintCheck

      - name: Lint the release variant
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew lintRelease

      - name: Test next_release
        run: python3 tools/test_next_release.py

      - name: No code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes; skipping the Kotlin checks."

  render:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        if: needs.changes.outputs.code == 'true'
        run: echo "" >> ./local.properties

      - name: Verify the theme goldens
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew verifyRoborazziDebug

      - name: No code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes; skipping the theme render."

  themes:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check theme resources
        if: needs.changes.outputs.themes == 'true'
        run: python3 tools/check_themes.py

      - name: No theme changes
        if: needs.changes.outputs.themes != 'true'
        run: echo "No theme changes; skipping the theme contract check."

  docs:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check markdown references
        if: needs.changes.outputs.docs == 'true'
        run: python3 tools/check_docs.py

      - name: No docs changes
        if: needs.changes.outputs.docs != 'true'
        run: echo "No markdown changes; skipping the reference check."

  pr_artifact:
    needs: changes
    runs-on: ubuntu-24.04
    # A pull request build exists for a human to install and look at. master is
    # handled by build_deploy, which publishes the signed release instead.
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/master')
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        run: echo "" >> ./local.properties

      - name: Restore keystore
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # AGP's default debug signing config reads $HOME/.android/debug.keystore.
          # Restoring the shared keystore keeps consecutive pr_artifact builds signed
          # with the same key, so adb install -r can update one over the other.
          mkdir -p "$HOME/.android"
          echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
          od -An -tx1 -N4 "$HOME/.android/debug.keystore"

      - name: Build the debug APK
        run: ./gradlew assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aa-torque-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build_deploy:
    needs: [lint, changes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The version bump reads commit messages back to the previous tag.
          fetch-depth: 0

      - name: Release from the branch tip
        run: |
          # The event SHA can lag the branch tip when another merge lands first. Bumping
          # from a stale base gets the push rejected with non-fast-forward, so release from
          # the real tip.
          git fetch origin master
          git reset --hard origin/master
          git log --oneline -1

      - name: Read the release version and refuse to release it twice
        id: version
        run: |
          # The version is bumped on the pull request, not here: a commit pushed to master
          # by this job would be a direct push, which the repository ruleset rejects.
          tag=$(grep -E '^(majorVersion|minorVersion|patchVersion)=' version.properties | cut -d= -f2 | paste -sd. -)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release version: $tag"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to release
        if: steps.version.outputs.exists == 'true'
        run: |
          echo "::notice title=already released::version ${{ steps.version.outputs.tag }} is already released. Open a release/* PR to bump version.properties and publish a new release."

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Restore keystore
        run: |
          # The injected -Pandroid.injected.signing.* flags sign the release APK. The copy in
          # ~/.android is belt and braces: it is the keystore AGP's default debug signing
          # config reads, so a build that loses the flags still uses this key instead of a
          # freshly generated one. Two different keys would make releases unable to update
          # each other on a device.
          mkdir -p "$HOME/.android"
          echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/debug.keystore"
          # JKS magic is fe ed fe ed; PKCS12 starts with 30 (ASN.1 SEQUENCE). Printing the
          # first bytes makes a wrong keystore fail here and not inside packageRelease.
          ls -l "$HOME/.android/debug.keystore"
          od -An -tx1 -N4 "$HOME/.android/debug.keystore"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Move the latest tag to this commit
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Build Release apk
        if: steps.version.outputs.exists == 'false' && github.repository == 'agronick/aa-torque'
        run: >
          echo "" >> ./local.properties &&
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$HOME/debug.keystore 
          -Pandroid.injected.signing.store.type=JKS 
          -Pandroid.injected.signing.key.alias=androiddebugkey 
          -Pandroid.injected.signing.store.password=android 
          -Pandroid.injected.signing.key.password=android

      - name: Build Release apk for forked repos
        if: steps.version.outputs.exists == 'false' && github.repository != 'agronick/aa-torque'
        run: >
           echo "" >> ./local.properties && ./gradlew assembleRelease
           -Pandroid.injected.signing.store.file=$HOME/debug.keystore
           -Pandroid.injected.signing.store.type=JKS
           -Pandroid.injected.signing.key.alias=androiddebugkey
           -Pandroid.injected.signing.store.password=android
           -Pandroid.injected.signing.key.password=android

      - name: Rename release
        if: steps.version.outputs.exists == 'false'
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aa-torque.apk

      - name: Verify the release is signed with the project key
        if: steps.version.outputs.exists == 'false'
        run: python3 tools/verify_signer.py app/build/outputs/apk/release/aa-torque.apk

      - name: Create Github Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Published immediately: the in-app updater reads /releases/latest, which
          # excludes drafts. The concurrency group above makes a burst of merges
          # collapse into one surviving run, so this publishes one version per burst.
          draft: false
          files: |
            app/build/outputs/apk/release/aa-torque.apk
            app/build/outputs/mapping/release/mapping.txt
