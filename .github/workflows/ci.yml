name: ci

# A push that only touches prose cannot change the APK, so it must not mint a version either.
# The whole workflow is skipped for those: no ktlint, no tests, no bump, no release. A mixed
# push still runs, because paths-ignore only fires when every changed file matches.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# One run per branch at a time. A burst of merges would otherwise start a
# build_deploy job per push, and every one of them bumps and pushes
# version.properties — on 2026-10-31 three of four failed that way with
# "non-fast-forward" and "tag already exists". The newest run wins; a run that
# was cancelled after it pushed its bump commit is caught by the bump guard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Prepare Gradle
        run: echo "" >> ./local.properties

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint the release variant
        run: ./gradlew lintRelease

      - name: Generate source inventory
        run: python3 tools/gen_inventory.py

      - name: Commit the inventory when it changed
        run: |
          if git diff --quiet -- docs/generated/inventory.md; then
            echo "inventory is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/inventory.md
          git commit -m "chore: refresh source inventory [skip ci]"
          # A push made with GITHUB_TOKEN does not start another workflow run,
          # so this commit cannot loop. `git push origin HEAD` targets the branch
          # of the same name and needs no ref_name interpolation.
          git push origin HEAD

  build_deploy:
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The version bump reads commit messages back to the previous tag.
          fetch-depth: 0

      - name: Release from the branch tip
        run: |
          # The lint job can push a refreshed inventory commit while this job waits, leaving
          # the event SHA behind the branch. Bumping from a stale base gets the push rejected
          # with non-fast-forward, so release from the real tip.
          git fetch origin master
          git reset --hard origin/master
          git log --oneline -1

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '19'

      - name: Restore keystore
        run: |
          # The injected -Pandroid.injected.signing.* flags sign the release APK. The copy in
          # ~/.android is belt and braces: it is the keystore AGP's default debug signing
          # config reads, so a build that loses the flags still uses this key instead of a
          # freshly generated one. Two different keys would make releases unable to update
          # each other on a device.
          mkdir -p "$HOME/.android"
          echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/debug.keystore"
          # JKS magic is fe ed fe ed; PKCS12 starts with 30 (ASN.1 SEQUENCE). Printing the
          # first bytes makes a wrong keystore fail here and not inside packageRelease.
          ls -l "$HOME/.android/debug.keystore"
          od -An -tx1 -N4 "$HOME/.android/debug.keystore"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Check whether this commit is already a version bump
        id: bump_guard
        run: |
          # A run cancelled after it pushed its bump commit leaves a
          # 'release: v...' commit on master. Do not bump a second time for it.
          if git log -1 --pretty=%s | grep -qE '^release: v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump_version
        if: github.repository == 'YuhiAida/aa-torque' && steps.bump_guard.outputs.skip == 'false'
        uses: oflynned/android-version-bump@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Build Release apk
        if: github.repository == 'agronick/aa-torque'
        run: >
          echo "" >> ./local.properties &&
          ./gradlew assembleRelease 
          -Pandroid.injected.signing.store.file=$HOME/debug.keystore 
          -Pandroid.injected.signing.store.type=JKS 
          -Pandroid.injected.signing.key.alias=androiddebugkey 
          -Pandroid.injected.signing.store.password=android 
          -Pandroid.injected.signing.key.password=android

      - name: Build Release apk for forked repos
        if: github.repository != 'agronick/aa-torque'
        run: >
           echo "" >> ./local.properties && ./gradlew assembleRelease
           -Pandroid.injected.signing.store.file=$HOME/debug.keystore
           -Pandroid.injected.signing.store.type=JKS
           -Pandroid.injected.signing.key.alias=androiddebugkey
           -Pandroid.injected.signing.store.password=android
           -Pandroid.injected.signing.key.password=android

      - name: Rename release
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/aa-torque.apk

      - name: Verify the release is signed with the project key
        run: python3 tools/verify_signer.py app/build/outputs/apk/release/aa-torque.apk

      - name: Read the release version
        id: version
        run: |
          tag=$(grep -E '^(majorVersion|minorVersion|patchVersion)=' version.properties | cut -d= -f2 | paste -sd. -)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release version: $tag"

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Published immediately: the in-app updater reads /releases/latest, which
          # excludes drafts. The concurrency group above makes a burst of merges
          # collapse into one surviving run, so this publishes one version per burst.
          draft: false
          files: |
            app/build/outputs/apk/release/aa-torque.apk
            app/build/outputs/mapping/release/mapping.txt
