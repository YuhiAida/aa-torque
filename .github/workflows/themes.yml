name: themes

# A theme is data: array entries, a style, a colour and four drawables. ci.yml
# compiles and lints it, but it never checks that the lists agree or that every
# referenced asset exists, so a half-added theme can still merge. This is the
# gate for that. It mirrors docs.yml.

on:
  push:
    paths:
      - 'app/src/main/res/values/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/main/res/drawable-*/**'
      - 'tools/check_themes.py'
      - '.github/workflows/themes.yml'
  # Fork PRs never push here, so this trigger is what checks them.
  pull_request:
    paths:
      - 'app/src/main/res/values/**'
      - 'app/src/main/res/drawable/**'
      - 'app/src/main/res/drawable-*/**'
      - 'tools/check_themes.py'
      - '.github/workflows/themes.yml'
  # Lets a maintainer run it by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: themes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check theme resources
        run: python3 tools/check_themes.py
