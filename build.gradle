// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.20'
    ext.gradle_version = '8.2.2'
    ext.google_services_version = '4.3.15'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "com.google.gms:google-services:$google_services_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        //
    }
}

plugins {
    // id 'com.google.dagger.hilt.android' version '2.44' apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
    id 'io.github.takahirom.roborazzi' version '1.47.0' apply false
}

ext {
    sourceCompatibility = JavaVersion.VERSION_19
    targetCompatibility = JavaVersion.VERSION_19
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://jitpack.io" }
        google()
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xlint:unchecked"
                // ITorqueService.java mirrors Torque's AIDL interface and carries ~28 dep-ann
                // warnings that are not ours to fix. Kotlin sources are compiled by kotlinc, so
                // this flag only reaches the three Java files in the app module.
                options.compilerArgs << "-Xlint:-dep-ann"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

